# Loki local de un solo proceso (PB-15). Sin puerto publicado: solo lo alcanza la red interna
# "backend" de compose.yaml. Un solo inquilino (auth_enabled: false) porque nadie fuera de esa red
# llega a él; el acceso de las personas pasa por Grafana, con usuario y contraseña.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true

# Nada sale de la máquina: sin estadísticas de uso hacia Grafana Labs.
analytics:
  reporting_enabled: false
