[project]
name = "acr"
version = "0.1.0"
description = "Advanced Code Review: revisión estática de repositorios para hackathons"
requires-python = ">=3.12"
license = "MIT"
# Las dependencias viven en requirements-dev.txt (versiones fijas, revisadas por una persona).

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["repos", "reports", "entregas"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
