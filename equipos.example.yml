# Copia este archivo como equipos.yml y llénalo con los datos del evento.
# equipos.yml está en .gitignore: nunca se sube al repositorio.
# También se puede editar desde la página Configuración del dashboard.

evento:
  nombre: "Hackathon 2026"
  inicio: 2026-11-01T09:00:00-06:00   # inicio del sprint: detecta commits previos
  fin:    2026-11-03T18:00:00-06:00   # cierre: fija la versión revisada y detecta commits posteriores

equipos:
  # Repositorio git (URL)
  - id: equipo-01                      # minúsculas, números y guiones
    nombre: "Equipo Alfa"
    proyecto: "Título del proyecto"
    objetivo: "Problema que resuelve y para quién"
    repo: https://github.com/org/proyecto-alfa
    rama: main                         # opcional
    commit: a1b2c3d                    # opcional: congela la versión entregada
    integrantes:                       # opcional: evidencia de colaboración
      - nombre: "Ana López"
        github: analopez
    presentacion: https://docs.google.com/presentation/d/ejemplo   # opcional
    prompts_ia: C:/entregas/alfa-prompts.pdf                       # opcional

  # Carpeta local
  - id: equipo-02
    nombre: "Equipo Beta"
    proyecto: "Título del proyecto"
    objetivo: "Problema que resuelve y para quién"
    repo: C:/entregas/proyecto-beta

  # Archivo ZIP
  - id: equipo-03
    nombre: "Equipo Gamma"
    proyecto: "Título del proyecto"
    objetivo: "Problema que resuelve y para quién"
    repo: C:/entregas/proyecto-gamma.zip
